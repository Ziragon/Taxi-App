spring:
  application:
    name: notification-service

  jpa:
    open-in-view: false
    properties:
      hibernate:
        ddl-auto: validate
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  datasource:
    url: jdbc:postgresql://localhost:5433/notification_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss.SSSZ"
    time-zone: UTC
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      database: 2
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        prefetch: 10
        acknowledge-mode: auto
        default-requeue-rejected: false

server:
  port: 8083
  shutdown: graceful
  forward-headers-strategy: framework

notification:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-min-32-chars-for-hmac-sha256}
    issuer: ${JWT_ISSUER:user-service}
  websocket:
    endpoint: /ws/notifications
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  internal:
    header: ${INTERNAL_HEADER:X-Internal-Header}
    header-key: ${HEADER_KEY:dev-secret-internal-key-for-microservices}
    user-service-url: ${USER_SERVICE_URL:http://localhost:8080}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.example.notificationservice: INFO
    org.springframework.web.socket: WARN
    org.springframework.messaging: WARN
    org.springframework.web.servlet.DispatcherServlet: WARN
    com.example.notificationservice.client.UserServiceClient: INFO
    feign: WARN
