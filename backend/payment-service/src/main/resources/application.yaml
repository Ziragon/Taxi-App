spring:
  application:
    name: payment-service
  profiles:
    active: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/payment_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss.SSSZ"
    time-zone: UTC
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        prefetch: 10
        acknowledge-mode: auto

server:
  port: 8082
  shutdown: graceful
  forward-headers-strategy: framework

stripe:
  api-key: ${STRIPE_API_KEY:sk_test_placeholder}

gateway-auth:
  header: ${JWT_HEADER:X-Gateway-Header}
  header-key: ${HEADER_KEY:dev-secret-key-for-microservices}

internal-auth:
  header: ${INTERNAL_HEADER:X-Internal-Header}
  header-key: ${HEADER_KEY:dev-secret-internal-key-for-microservices}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    org.hibernate: INFO
    com.example.paymentservice: DEBUG
