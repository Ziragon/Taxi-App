spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - PreserveHostHeader
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/v1/auth/**, /api/v1/drivers/location, /api/v1/profiles/**, /api/v1/vehicles/**, /api/v1/admin/**

            - id: user-service-docs
              uri: ${USER_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/user-service/v3/api-docs
              filters:
                - RewritePath=/user-service/v3/api-docs, /v3/api-docs

            - id: trip-service
              uri: ${TRIP_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/trips/**

            - id: trip-service-docs
              uri: ${TRIP_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/trip-service/v3/api-docs
              filters:
                - RewritePath=/trip-service/v3/api-docs, /v3/api-docs

server:
  port: 8000
  shutdown: graceful
  forward-headers-strategy: framework

gateway:
  secret: ${JWT_SECRET:dev-secret-key-min-32-chars-for-hmac-sha256}
  issuer: ${JWT_ISSUER:user-service}
  header: ${JWT_HEADER:X-Gateway-Header}
  header-key: ${HEADER_KEY:dev-secret-key-for-microservices}
  open-routes:
    - /api/v1/auth/**
    - /actuator/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /user-service/v3/api-docs
    - /trip-service/v3/api-docs
    - /webjars/**
    - /v3/api-docs/**

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /user-service/v3/api-docs
      - name: trip-service
        url: /trip-service/v3/api-docs

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG