name: taxi-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      - postgres

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "8001:8001"
    environment:
      - RI_APP_PORT=8001
    depends_on:
      - redis

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  osrm:
    image: ghcr.io/ziragon/osrm-novosibirsk:dev
    ports:
      - "5000:5000"

  gateway-service:
    image: ghcr.io/ziragon/taxi-app/gateway-service:dev
    ports:
      - "8000:8000"
    environment:
      - USER_SERVICE_URL=http://user-service:8080
      - TRIP_SERVICE_URL=http://trip-service:8081
      - PAYMENT_SERVICE_URL=http://payment-service:8082
      - CORS_ALLOWED_ORIGINS=*

  user-service:
    image: ghcr.io/ziragon/taxi-app/user-service:dev
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/user_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - TRIP_SERVICE=http://trip-service:8081
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq

  trip-service:
    image: ghcr.io/ziragon/taxi-app/trip-service:dev
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/trip_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - USER_SERVICE=http://user-service:8080
      - PAYMENT_SERVICE_URL=http://payment-service:8082
      - OSRM_BASE_URL=${OSRM_BASE_URL:-http://osrm:5000}

  payment-service:
    image: ghcr.io/ziragon/taxi-app/payment-service:dev
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/payment_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - RABBITMQ_HOST=rabbitmq
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - TRIP_SERVICE_URL=http://trip-service:8081
    depends_on:
      - postgres
      - rabbitmq

  notification-service:
    image: ghcr.io/ziragon/taxi-app/notification-service:dev
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/notification_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - USER_SERVICE_URL=http://user-service:8080

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
