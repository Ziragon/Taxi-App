spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:tc:postgresql:17-alpine:///user_db&loggerLevel=OFF
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost


  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss.SSSZ"
    time-zone: UTC
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

jwt:
  secret: test-secret-key-for-unit-tests-must-be-at-least-32-characters-long
  issuer: user-service-test
  access-token:
    expiration: 5m
  refresh-token:
    expiration: 10m

logging:
  level:
    root: INFO
    com.example.userservice: DEBUG
    org.springframework.test: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE