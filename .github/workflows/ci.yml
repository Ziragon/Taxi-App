name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            gateway-service:
              - 'backend/gateway-service/**'
            user-service:
              - 'backend/user-service/**'
            trip-service:
              - 'backend/trip-service/**'
            payment-service:
              - 'backend/payment-service/**'
            notification-service:                        
              - 'backend/notification-service/**'

      - name: Set matrix
        id: set-matrix
        run: |
          services=()
          [[ "${{ steps.filter.outputs.gateway-service }}" == "true" ]] && services+=("gateway-service")
          [[ "${{ steps.filter.outputs.user-service }}" == "true" ]] && services+=("user-service")
          [[ "${{ steps.filter.outputs.trip-service }}" == "true" ]] && services+=("trip-service")
          [[ "${{ steps.filter.outputs.payment-service }}" == "true" ]] && services+=("payment-service")
          [[ "${{ steps.filter.outputs.notification-service }}" == "true" ]] && services+=("notification-service")

          if [ ${#services[@]} -eq 0 ]; then
            echo "services=[]" >> $GITHUB_OUTPUT
          else
            json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -cs .)
            echo "services=$json" >> $GITHUB_OUTPUT
          fi

  build-and-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' && needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Testcontainers
        uses: actions/cache@v4
        with:
          path: ~/.testcontainers
          key: ${{ runner.os }}-testcontainers-${{ hashFiles('**/build.gradle', '**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-testcontainers-

      - name: Pull Testcontainers images
        run: |
          docker pull rabbitmq:4.0-management-alpine
          docker pull redis:7.2-alpine

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make gradlew executable
        working-directory: backend
        run: chmod +x ./gradlew

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test ${{ matrix.service }}
        working-directory: backend
        run: ./gradlew :${{ matrix.service }}:build
        env:
          TESTCONTAINERS_RYUK_DISABLED: false
          TESTCONTAINERS_REUSE_ENABLE: false
          TESTCONTAINERS_CHECKS_DISABLE: false

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ matrix.service }}
          path: backend/${{ matrix.service }}/build/reports/tests/test/**
          retention-days: 7

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: backend/${{ matrix.service }}/build/libs/${{ matrix.service }}.jar
          retention-days: 1

      - name: Cleanup Docker
        if: always()
        run: |
          docker container prune -f
          docker image prune -f

  build-and-push:
    needs: [ detect-changes, build-and-test ]
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: backend/${{ matrix.service }}/build/libs/

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JAR_PATH=${{ matrix.service }}/build/libs/${{ matrix.service }}.jar

  ci-success:
    needs: [ detect-changes, build-and-test, build-and-push ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        if: |
          needs.build-and-test.result == 'failure' || needs.build-and-test.result == 'cancelled' ||
          needs.build-and-push.result == 'failure'  || needs.build-and-push.result == 'cancelled'
        run: |
          echo "build-and-test: ${{ needs.build-and-test.result }}"
          echo "build-and-push: ${{ needs.build-and-push.result }}"
          exit 1

      - name: Success
        run: echo "CI passed"