name: CI

on:
  push:
    branches: [ "main", "dev", "feature/ci-container-building" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'

  build-and-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: read
    
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway-service
          - user-service
          - trip-service
          - payment-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Testcontainers
        uses: actions/cache@v4
        with:
          path: ~/.testcontainers
          key: ${{ runner.os }}-testcontainers-${{ hashFiles('**/build.gradle', '**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-testcontainers-

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make gradlew executable
        working-directory: backend
        run: chmod +x ./gradlew

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test ${{ matrix.service }}
        working-directory: backend
        run: ./gradlew :${{ matrix.service }}:build
        env:
          TESTCONTAINERS_CHECKS_DISABLE: false

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ matrix.service }}
          path: backend/${{ matrix.service }}/build/reports/tests/test/**
          retention-days: 7

      - name: Cleanup Docker
        if: always()
        run: |
          docker container prune -f
          docker image prune -f

  ci-success:
    needs: [ detect-changes, build-and-test ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          build_result="${{ needs.build-and-test.result }}"
          if [[ "$build_result" == "failure" || "$build_result" == "cancelled" ]]; then
            echo "Build job failed or was cancelled"
            exit 1
          fi
          echo "CI passed (build: $build_result)"