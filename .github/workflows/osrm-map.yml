name: Build OSRM Map

on:
  workflow_dispatch:
  push:
    branches:
      - feature/trip-service-logic

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push OSRM image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/docker/osrm/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/osrm-novosibirsk:latest